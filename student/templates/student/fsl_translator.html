{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>FSL Translator | FSLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; background-color: #f0f8ff; height: 100vh; overflow: hidden; }
        
        /* The Layout */
        .main-container { height: 100vh; padding: 20px; }
        
        /* LEFT SIDE: The Live Player */
        .player-box {
            background-color: #212529;
            border-radius: 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            position: relative;
        }
        
        /* We need BOTH tags, hidden by default */
        .media-display {
            max-height: 400px;
            max-width: 100%;
            object-fit: contain;
            border-radius: 10px;
            display: none; /* Hidden initially */
        }

        .current-char {
            font-size: 5rem;
            font-weight: bold;
            color: #ffc107; /* Warning Yellow */
            margin-top: 20px;
            text-transform: uppercase;
        }

        /* RIGHT SIDE: The Storyboard */
        .storyboard-box {
            background: white;
            border-radius: 20px;
            height: 100%;
            padding: 30px;
            overflow-y: auto; 
        }
        .sign-card {
            width: 100px;
            display: inline-block;
            text-align: center;
            margin: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 15px;
            border: 2px solid #dee2e6;
            transition: transform 0.2s;
            vertical-align: top;
        }
        .sign-card img, .sign-card video { 
            width: 100%; 
            height: 80px; /* Fixed height for neatness */
            object-fit: contain; 
        }
        .sign-card:hover { transform: scale(1.1); border-color: #6f42c1; }
        .active-card { background-color: #d1e7dd; border-color: #198754; transform: scale(1.1); }
        
        /* Special Characters Buttons */
        .special-char-btn {
            min-width: 50px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container-fluid main-container">
        <a href="{% url 'student:student_dashboard' %}" class="btn btn-outline-dark rounded-pill mb-3 position-absolute" style="z-index: 10; top: 30px; left: 40px;">← Dashboard</a>

        <div class="row h-100 g-4">
            
            <div class="col-lg-6">
                <div class="player-box shadow">
                    <img id="imgPlayer" src="" class="media-display">
                    
                    <video id="videoPlayer" class="media-display" muted playsinline>
                        <source src="" type="video/mp4">
                    </video>

                    <div id="placeholder" class="text-white-50">
                        <h3>Type to start...</h3>
                    </div>
                    
                    <div id="bigLetterDisplay" class="current-char"></div>

                    <div class="mt-4">
                        <button onclick="playSequence()" class="btn btn-success btn-lg rounded-pill px-5 fw-bold shadow">
                            ▶ Replay
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="storyboard-box shadow">
                    <h2 class="fw-bold mb-4" style="color: #6f42c1;">Fingerspell Translator</h2>
                    
                    <div class="mb-5">
                        <div class="input-group input-group-lg">
                            <input type="text" id="textInput" class="form-control rounded-start-pill border-2" placeholder="Type here (e.g. HELLO)...">
                            <button class="btn btn-primary rounded-end-pill fw-bold px-4" type="button" onclick="processText()">Translate 🚀</button>
                        </div>
                        
                        <div class="mt-2 text-muted small d-flex align-items-center gap-2">
                            <span>Insert Special:</span>
                            <button class="btn btn-sm btn-outline-secondary special-char-btn rounded-pill" onclick="insertChar('ñ')">ñ</button>
                            <button class="btn btn-sm btn-outline-secondary special-char-btn rounded-pill" onclick="insertChar('ng')">ng</button>
                        </div>
                    </div>

                    <h5 class="text-muted fw-bold mb-3">Breakdown:</h5>
                    <div id="storyboardGrid">
                        <div class="text-center text-muted mt-5">
                            Type something above to see the signs!
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DATA FROM DJANGO
        const signMap = {{ sign_map|safe }}; 
        
        let currentSequence = [];
        let isPlaying = false;

        // NEW FUNCTION: Insert special characters
        function insertChar(char) {
            const input = document.getElementById('textInput');
            input.value += char;
            input.focus();
        }

        function processText() {
            const input = document.getElementById('textInput').value.toLowerCase();
            const grid = document.getElementById('storyboardGrid');
            
            grid.innerHTML = '';
            currentSequence = [];

            // 1. Build the Sequence (With Special Handling for 'ng')
            let i = 0;
            while (i < input.length) {
                let char = input[i];
                let nextChar = input[i+1];
                let token = char;

                // CHECK FOR 'ng' (2 letters treated as 1 sign)
                if (char === 'n' && nextChar === 'g') {
                    if (signMap['ng']) {
                        token = 'ng';
                        i++; // Skip the 'g'
                    }
                }
                
                // If we have a file for this token (a, b, ñ, ng, etc.)
                if (signMap[token]) {
                    const mediaUrl = signMap[token];
                    const isVideo = mediaUrl.endsWith('.mp4');
                    
                    currentSequence.push({ 
                        char: token, 
                        url: mediaUrl,
                        isVideo: isVideo 
                    });

                    // 2. Add to Storyboard
                    const card = document.createElement('div');
                    card.className = 'sign-card shadow-sm';
                    card.id = `card-${currentSequence.length - 1}`;
                    
                    let mediaHtml = '';
                    if (isVideo) {
                        mediaHtml = `<video src="${mediaUrl}" muted></video>`;
                    } else {
                        mediaHtml = `<img src="${mediaUrl}">`;
                    }

                    card.innerHTML = `
                        ${mediaHtml}
                        <div class="fw-bold mt-2 text-uppercase">${token}</div>
                    `;
                    grid.appendChild(card);
                }
                i++;
            }

            if (currentSequence.length > 0) {
                playSequence();
            } else {
                alert("No recognizable letters found!");
            }
        }

        // --- THE SMART PLAYER LOGIC ---
        function playSequence() {
            if (isPlaying || currentSequence.length === 0) return;
            isPlaying = true;
            
            playStep(0); 
        }

        function playStep(index) {
            if (index >= currentSequence.length) {
                isPlaying = false;
                resetPlayer(); 
                return;
            }

            const item = currentSequence[index];
            const imgPlayer = document.getElementById('imgPlayer');
            const videoPlayer = document.getElementById('videoPlayer');
            const placeholder = document.getElementById('placeholder');
            const bigLetter = document.getElementById('bigLetterDisplay');

            // 1. Highlight Storyboard Card
            document.querySelectorAll('.sign-card').forEach(c => c.classList.remove('active-card'));
            const activeCard = document.getElementById(`card-${index}`);
            if(activeCard) {
                activeCard.classList.add('active-card');
                activeCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            // 2. Set Letter Display
            bigLetter.innerText = item.char;
            placeholder.style.display = 'none';

            // 3. Play Logic (Image vs Video)
            if (item.isVideo) {
                imgPlayer.style.display = 'none';
                videoPlayer.style.display = 'block';
                
                videoPlayer.src = item.url;
                videoPlayer.play();

                videoPlayer.onended = function() {
                    playStep(index + 1);
                };

            } else {
                videoPlayer.style.display = 'none';
                videoPlayer.pause(); 
                imgPlayer.style.display = 'block';
                
                imgPlayer.src = item.url;

                setTimeout(() => {
                    playStep(index + 1);
                }, 1000); 
            }
        }

        function resetPlayer() {
            document.getElementById('imgPlayer').style.display = 'none';
            document.getElementById('videoPlayer').style.display = 'none';
            document.getElementById('placeholder').style.display = 'block';
            document.getElementById('bigLetterDisplay').innerText = "DONE";
            document.querySelectorAll('.sign-card').forEach(c => c.classList.remove('active-card'));
        }
    </script>

</body>
</html>
