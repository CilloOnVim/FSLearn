{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>FSL Translator | FSLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; background-color: #f0f8ff; height: 100vh; overflow: hidden; }
        
        /* The Layout */
        .main-container { height: 100vh; padding: 20px; }
        
        /* LEFT SIDE: The Live Player */
        .player-box {
            background-color: #212529;
            border-radius: 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            position: relative;
        }
        .sign-display {
            max-height: 400px;
            max-width: 100%;
            object-fit: contain;
            border-radius: 10px;
        }
        .current-char {
            font-size: 5rem;
            font-weight: bold;
            color: #ffc107; /* Warning Yellow */
            margin-top: 20px;
            text-transform: uppercase;
        }

        /* RIGHT SIDE: The Storyboard */
        .storyboard-box {
            background: white;
            border-radius: 20px;
            height: 100%;
            padding: 30px;
            overflow-y: auto; /* Scrollable if text is long */
        }
        .sign-card {
            width: 100px;
            display: inline-block;
            text-align: center;
            margin: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 15px;
            border: 2px solid #dee2e6;
            transition: transform 0.2s;
        }
        .sign-card img { width: 100%; height: auto; }
        .sign-card:hover { transform: scale(1.1); border-color: #6f42c1; }
        .active-card { background-color: #d1e7dd; border-color: #198754; transform: scale(1.1); }
    </style>
</head>
<body>

    <div class="container-fluid main-container">
        <a href="{% url 'student:student_dashboard' %}" class="btn btn-outline-dark rounded-pill mb-3 position-absolute" style="z-index: 10; top: 30px; left: 40px;">← Dashboard</a>

        <div class="row h-100 g-4">
            
            <div class="col-lg-6">
                <div class="player-box shadow">
                    <img id="mainDisplay" src="https://placehold.co/400x400/333/999?text=Ready" class="sign-display">
                    
                    <div id="bigLetterDisplay" class="current-char">?</div>

                    <div class="mt-4">
                        <button onclick="playSequence()" class="btn btn-success btn-lg rounded-pill px-5 fw-bold shadow">
                            ▶ Replay
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="storyboard-box shadow">
                    <h2 class="fw-bold mb-4" style="color: #6f42c1;">Fingerspell Translator</h2>
                    
                    <div class="input-group input-group-lg mb-5">
                        <input type="text" id="textInput" class="form-control rounded-start-pill border-2" placeholder="Type here (e.g. HELLO)...">
                        <button class="btn btn-primary rounded-end-pill fw-bold px-4" type="button" onclick="processText()">Translate 🚀</button>
                    </div>

                    <h5 class="text-muted fw-bold mb-3">Breakdown:</h5>
                    <div id="storyboardGrid">
                        <div class="text-center text-muted mt-5">
                            Type something above to see the signs!
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Get the data from Django Views
        // The 'safe' filter is required to render JSON correctly in templates
        const signMap = {{ sign_map|safe }}; 
        
        let animationInterval;
        let currentSequence = [];

        function processText() {
            const input = document.getElementById('textInput').value.toLowerCase();
            const grid = document.getElementById('storyboardGrid');
            
            // Clear previous results
            grid.innerHTML = '';
            currentSequence = [];
            clearInterval(animationInterval);

            // Loop through input string
            for (let char of input) {
                // Ignore spaces for now, or you could add a 'space' image
                if (signMap[char]) {
                    const imageUrl = signMap[char];
                    currentSequence.push({ char: char, url: imageUrl });

                    // Add to Storyboard (Right Side)
                    const card = document.createElement('div');
                    card.className = 'sign-card shadow-sm';
                    card.id = `card-${currentSequence.length - 1}`; // Index for highlighting
                    card.innerHTML = `
                        <img src="${imageUrl}">
                        <div class="fw-bold mt-2 text-uppercase">${char}</div>
                    `;
                    grid.appendChild(card);
                }
            }

            if (currentSequence.length > 0) {
                playSequence();
            } else {
                alert("No recognizable letters found!");
            }
        }

        function playSequence() {
            let index = 0;
            const mainImg = document.getElementById('mainDisplay');
            const bigLetter = document.getElementById('bigLetterDisplay');

            // Clear any running interval
            if (animationInterval) clearInterval(animationInterval);

            // Function to update the frame
            animationInterval = setInterval(() => {
                if (index >= currentSequence.length) {
                    index = 0; // Loop automatically? Or clearInterval to stop.
                    // Let's loop it for better learning
                }

                const item = currentSequence[index];
                
                // Update Player (Left)
                mainImg.src = item.url;
                bigLetter.innerText = item.char;

                // Highlight Storyboard (Right)
                document.querySelectorAll('.sign-card').forEach(c => c.classList.remove('active-card'));
                const activeCard = document.getElementById(`card-${index}`);
                if(activeCard) {
                    activeCard.classList.add('active-card');
                    activeCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }

                index++;
            }, 800); // 800ms speed per letter
        }
    </script>

</body>
</html>
