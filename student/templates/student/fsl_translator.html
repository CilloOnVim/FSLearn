{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSL Translator | FSLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --mint: #20c997;
            --mint-dark: #128c68;
            --purple: #6f42c1;
            --purple-dark: #4e2d8b;
            --cyan: #0dcaf0;
            --cyan-dark: #0aa2c0;
            --yellow: #ffd700;
            --yellow-dark: #d4b200;
            --pink: #ff6b6b;
            --pink-dark: #c92a2a;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #f0f8ff;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        .top-bar {
            background-color: white;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            z-index: 10;
        }

        .btn-back {
            background-color: var(--purple);
            color: white !important;
            border-radius: 50px;
            padding: 10px 25px;
            font-weight: 700;
            font-size: 1.2rem;
            text-decoration: none;
            box-shadow: 0 5px 0px var(--purple-dark);
            transition: all 0.1s;
        }

        .btn-back:active {
            transform: translateY(5px);
            box-shadow: 0 0px 0px transparent;
        }

        .page-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--pink);
            margin: 0;
        }

        /* Main Split Workspace */
        .main-workspace {
            flex-grow: 1;
            display: flex;
            gap: 20px;
            padding: 20px;
            overflow: hidden;
        }

        /* LEFT SIDE: The Live Player */
        .player-box {
            flex: 1;
            background-color: white;
            border-radius: 35px;
            border: 5px solid var(--mint);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            padding: 20px;
            position: relative;
        }

        .media-display {
            width: 100%;
            height: 100%;
            max-height: 40vh;
            object-fit: contain;
            border-radius: 20px;
            background-color: #e9ecef;
            display: none;
        }

        .current-char {
            font-size: 7rem;
            font-weight: 700;
            color: var(--purple);
            margin-top: 10px;
            text-transform: uppercase;
            line-height: 1;
        }

        .placeholder-text {
            font-size: 3rem;
            color: #ccc;
            font-weight: 700;
        }

        .btn-replay {
            background-color: var(--yellow);
            color: #333;
            font-size: 1.5rem;
            font-weight: 700;
            padding: 10px 30px;
            border-radius: 30px;
            border: none;
            box-shadow: 0 5px 0px var(--yellow-dark);
            margin-top: 15px;
            transition: all 0.1s;
        }

        .btn-replay:active {
            transform: translateY(5px);
            box-shadow: 0 0px 0px transparent;
        }

        /* RIGHT SIDE: Input & Storyboard */
        .input-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow: hidden;
        }

        /* Giant Input Controls */
        .input-box {
            background: white;
            border-radius: 35px;
            padding: 25px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            border: 5px solid var(--cyan);
        }

        .giant-input {
            font-size: 2rem !important;
            font-weight: 700;
            border: 3px solid #dee2e6 !important;
            color: var(--purple);
            padding: 15px 25px !important;
        }

        .giant-input::placeholder {
            color: #adb5bd;
            font-weight: 400;
        }

        .btn-translate {
            background-color: var(--pink);
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
            border: none;
            padding: 0 30px;
            transition: all 0.1s;
        }

        .btn-translate:hover {
            background-color: var(--pink-dark);
            color: white;
        }

        .special-char-btn {
            background-color: var(--mint);
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            border: none;
            padding: 5px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 0px var(--mint-dark);
        }

        .special-char-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0px transparent;
        }

        /* Storyboard Scrolling Area */
        .storyboard-box {
            background: white;
            border-radius: 35px;
            padding: 25px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            flex-grow: 1;
            overflow-y: auto;
            border: 5px solid #dee2e6;
        }

        .storyboard-box::-webkit-scrollbar {
            width: 12px;
        }

        .storyboard-box::-webkit-scrollbar-thumb {
            background: var(--cyan);
            border-radius: 10px;
        }

        #storyboardGrid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .sign-card {
            width: 120px;
            background: #f8f9fa;
            border-radius: 20px;
            border: 4px solid #dee2e6;
            padding: 15px;
            text-align: center;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sign-card img,
        .sign-card video {
            width: 100%;
            height: 80px;
            object-fit: contain;
            border-radius: 10px;
            background: white;
        }

        .active-card {
            background-color: #fff8cc;
            border-color: var(--yellow);
            transform: scale(1.08);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 900px) {
            .main-workspace {
                flex-direction: column;
                overflow-y: auto;
            }

            body {
                overflow: auto;
            }

            .player-box {
                min-height: 400px;
            }
        }
    </style>
</head>

<body>

    <div class="top-bar">
        <a href="{% url 'student:student_dashboard' %}" class="btn-back">🔙 Back</a>
        <h1 class="page-title">Fingerspell Translator</h1>
        <div style="width: 100px;"></div>
    </div>

    <div class="main-workspace">

        <div class="player-box">
            <div id="placeholder" class="placeholder-text">
                Type a word! ⌨️
            </div>

            <img id="imgPlayer" src="" class="media-display">

            <video id="videoPlayer" class="media-display" muted playsinline>
                <source src="" type="video/mp4">
            </video>

            <div id="bigLetterDisplay" class="current-char"></div>

            <button onclick="playSequence()" class="btn-replay" id="replayBtn" style="display: none;">
                ▶ Replay
            </button>
        </div>

        <div class="input-panel">

            <div class="input-box">
                <div class="input-group input-group-lg mb-3">
                    <input type="text" id="textInput" class="form-control giant-input rounded-start-pill"
                        placeholder="e.g. HELLO">
                    <button class="btn btn-translate rounded-end-pill" type="button" onclick="processText()">🚀</button>
                </div>

                <div class="d-flex align-items-center gap-3 justify-content-center">
                    <span class="fs-4 fw-bold text-muted">Special:</span>
                    <button class="special-char-btn" onclick="insertChar('ñ')">ñ</button>
                    <button class="special-char-btn" onclick="insertChar('ng')">ng</button>
                </div>
            </div>

            <div class="storyboard-box">
                <h3 class="fw-bold mb-3 text-center" style="color: var(--cyan);">Sign Sequence</h3>
                <div id="storyboardGrid">
                    <div class="text-center text-muted fs-4 mt-4 w-100">
                        Nothing to spell yet! 🙈
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script>
        // DATA FROM DJANGO
        const signMap = {{ sign_map| safe }};

        let currentSequence = [];
        let isPlaying = false;

        function insertChar(char) {
            const input = document.getElementById('textInput');
            input.value += char;
            input.focus();
        }

        // Listen for "Enter" key press to trigger translation instantly
        document.getElementById('textInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                processText();
            }
        });

        function processText() {
            const input = document.getElementById('textInput').value.toLowerCase().trim();
            const grid = document.getElementById('storyboardGrid');

            if (!input) return;

            grid.innerHTML = '';
            currentSequence = [];

            let i = 0;
            while (i < input.length) {
                let char = input[i];
                let nextChar = input[i + 1];
                let token = char;

                // Map the literal space character to your new database entry
                if (char === ' ') {
                    token = 'space';
                } 
                // Handle the Filipino 'ng' digraph
                else if (char === 'n' && nextChar === 'g') {
                    if (signMap['ng']) {
                        token = 'ng';
                        i++;
                    }
                }

                // Look up the token in the Django dictionary
                if (signMap[token]) {
                    const mediaUrl = signMap[token];
                    // PATCHED: Check for Cloudinary URLs properly
                    const isVideo = mediaUrl.includes('/video/') || mediaUrl.includes('.mp4');

                    currentSequence.push({
                        char: token === 'space' ? 'SPACE' : token, 
                        url: mediaUrl,
                        isVideo: isVideo,
                        // PATCHED: Define isSpace so the player knows to pause
                        isSpace: token === 'space' 
                    });

                    const card = document.createElement('div');
                    card.className = 'sign-card shadow-sm';
                    card.id = `card-${currentSequence.length - 1}`;

                    // PATCHED: Force videos to autoplay and loop silently in the grid
                    let mediaHtml = isVideo
                        ? `<video src="${mediaUrl}" autoplay loop muted playsinline></video>`
                        : `<img src="${mediaUrl}">`;

                    let displayChar = token === 'space' ? '___' : token;

                    card.innerHTML = `
                        ${mediaHtml}
                        <div class="fw-bold mt-2 text-uppercase fs-3" style="color: var(--purple);">${displayChar}</div>
                    `;
                    grid.appendChild(card);
                }
                i++;
            }

            if (currentSequence.length > 0) {
                document.getElementById('replayBtn').style.display = 'block';
                playSequence();
            } else {
                grid.innerHTML = '<div class="text-center text-danger fs-4 mt-4 w-100 fw-bold">No signs found for those letters! 🚫</div>';
                document.getElementById('replayBtn').style.display = 'none';
            }
        }

        function playSequence() {
            if (isPlaying || currentSequence.length === 0) return;
            isPlaying = true;
            playStep(0);
        }

        function playStep(index) {
            if (index >= currentSequence.length) {
                isPlaying = false;
                resetPlayer();
                return;
            }

            const item = currentSequence[index];
            const imgPlayer = document.getElementById('imgPlayer');
            const videoPlayer = document.getElementById('videoPlayer');
            const placeholder = document.getElementById('placeholder');
            const bigLetter = document.getElementById('bigLetterDisplay');

            document.querySelectorAll('.sign-card').forEach(c => c.classList.remove('active-card'));
            const activeCard = document.getElementById(`card-${index}`);
            if (activeCard) {
                activeCard.classList.add('active-card');
                activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            placeholder.style.display = 'none';

            // The previous lock on Space has been removed, so the Space video can play normally just like any other letter!
            
            bigLetter.innerText = item.char;

            if (item.isVideo) {
                imgPlayer.style.display = 'none';
                videoPlayer.style.display = 'block';
                videoPlayer.src = item.url;
                videoPlayer.play();
                videoPlayer.onended = function () { playStep(index + 1); };
            } else {
                videoPlayer.style.display = 'none';
                videoPlayer.pause();
                imgPlayer.style.display = 'block';
                imgPlayer.src = item.url;
                setTimeout(() => { playStep(index + 1); }, 1000); 
            }
        }

        function resetPlayer() {
            document.getElementById('imgPlayer').style.display = 'none';
            document.getElementById('videoPlayer').style.display = 'none';
            document.getElementById('placeholder').style.display = 'block';
            document.getElementById('placeholder').innerText = "DONE! 🎉";
            document.getElementById('bigLetterDisplay').innerText = "";
            document.querySelectorAll('.sign-card').forEach(c => c.classList.remove('active-card'));
        }
    </script>
</body>

</html>
