{% load static %}
<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to FSLearn!</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        :root {
            --mint: #20c997;
            --mint-dark: #128c68;
            --teacher-blue: #0d6efd;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: "Fredoka", sans-serif;
            background: linear-gradient(135deg, #cceeff, #fdf6ff);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main Container */
        .main-wrapper {
            width: 100%;
            max-width: 900px;
            padding: 15px;
        }

        .content-card {
            background: white;
            border-radius: 35px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
            height: calc(100vh - 30px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            /* Spreads out the content */
            align-items: center;
        }

        /* Header Area */
        .header-area {
            margin-bottom: 10px;
        }

        .logo-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 3rem;
            line-height: 1;
        }

        .title {
            font-size: 3rem;
            font-weight: 700;
            color: var(--teacher-blue);
            margin: 0;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #555;
            margin-top: 5px;
            margin-bottom: 0;
        }

        /* Carousel Area */
        .carousel-wrapper {
            width: 100%;
            max-width: 500px;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            /* Prevents layout shifting */
        }

        .carousel-inner {
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .carousel-item img {
            width: 100%;
            height: auto;
            object-fit: cover;
        }

        /* Call to Action Area */
        .action-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        /* Student Button - Massive & Primary */
        .student-btn {
            background-color: var(--mint);
            color: white !important;
            font-size: 2rem;
            font-weight: 700;
            padding: 20px 50px;
            border-radius: 50px;
            border: none;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 0px var(--mint-dark), 0 15px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.15s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }

        .student-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0px 0px var(--mint-dark);
        }

        /* Teacher Button - Secondary & Clean */
        .teacher-link {
            color: #6c757d;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 20px;
            transition: background-color 0.2s;
        }

        .teacher-link:hover {
            background-color: #f8f9fa;
            color: var(--teacher-blue);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .title {
                font-size: 2.2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .student-btn {
                font-size: 1.6rem;
                padding: 15px 30px;
            }

            .logo-icon {
                font-size: 2.2rem;
            }
        }
    </style>
</head>

<body>

    <div class="main-wrapper">
        <div class="content-card">

            <div class="header-area">
                <div class="logo-area">
                    <div class="logo-icon">🖐️</div>
                    <h1 class="title">FSLearn</h1>
                </div>
                <p class="subtitle">Learn Filipino Sign Language!</p>
            </div>

            <div class="carousel-wrapper">
                <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
                    <div class="carousel-indicators">
                        <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0" class="active"
                            aria-current="true" aria-label="Slide 1"></button>
                        <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1"
                            aria-label="Slide 2"></button>
                        <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2"
                            aria-label="Slide 3"></button>
                    </div>
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="https://placehold.co/600x350/87CEEB/FFFFFF?text=Fun+Games!" alt="Fun Games">
                        </div>
                        <div class="carousel-item">
                            <img src="https://placehold.co/600x350/FFB6C1/FFFFFF?text=Learn+Signs!" alt="Learn Signs">
                        </div>
                        <div class="carousel-item">
                            <img src="https://placehold.co/600x350/98FB98/333333?text=Earn+Badges!" alt="Earn Badges">
                        </div>
                    </div>
                </div>
            </div>

            <div class="action-area">
                <a href="{% url 'core:login' %}?role=student" class="student-btn">
                    <span>🎓</span> Play Now!
                </a>

                <a href="{% url 'core:login' %}?role=teacher" class="teacher-link">
                    🍎 Teacher Login
                </a>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
