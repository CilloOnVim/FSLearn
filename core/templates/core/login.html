{% load static %}
<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | FSLearn</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        :root {
            --primary-blue: #0d6efd;
            --soft-blue: #f0f8ff;
            --warm-yellow: #ffd700;
            --text-dark: #2b3035;
        }

        body {
            font-family: "Fredoka", sans-serif;
            background-color: var(--soft-blue);
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* Ambient Background Elements */
        .bg-shape {
            position: fixed;
            border-radius: 50%;
            z-index: -1;
            opacity: 0.4;
        }

        .bg-shape-1 {
            width: 300px;
            height: 300px;
            background: #e0f0ff;
            top: -50px;
            left: -50px;
        }

        .bg-shape-2 {
            width: 250px;
            height: 250px;
            background: #fff0f5;
            bottom: -50px;
            right: 10%;
        }

        /* Login Card */
        .login-card {
            background: white;
            padding: 3rem 2.5rem;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            border: 4px solid rgba(255, 255, 255, 0.8);
            max-width: 450px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        /* Decorative Header Icon */
        .login-header-icon {
            font-size: 3.5rem;
            margin-bottom: 10px;
            display: inline-block;
            background: var(--soft-blue);
            width: 90px;
            height: 90px;
            line-height: 90px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            margin-top: -60px;
            /* Pull it up out of the card slightly */
        }

        .login-title {
            color: #6610f2;
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 30px;
        }

        /* Form Inputs */
        .form-control {
            border-radius: 15px;
            padding: 12px 20px;
            border: 2px solid #e9ecef;
            background-color: #f8f9fa;
            font-size: 1.1rem;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: var(--warm-yellow);
            box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.2);
            background-color: white;
        }

        .form-label {
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            font-size: 1.05rem;
        }

        /* Submit Button */
        .btn-submit {
            background-color: var(--primary-blue);
            color: white;
            border-radius: 50px;
            padding: 14px 20px;
            font-size: 1.25rem;
            font-weight: 600;
            border: none;
            width: 100%;
            margin-top: 15px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 0px rgba(13, 110, 253, 0.3), 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 0px rgba(13, 110, 253, 0.3), 0 15px 25px rgba(0, 0, 0, 0.15);
            color: white;
            background-color: #0b5ed7;
        }

        .btn-submit:active {
            transform: translateY(5px);
            box-shadow: 0 0px 0px rgba(13, 110, 253, 0.3), 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Back Link */
        .back-link {
            color: #888;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s;
            display: inline-block;
            margin-top: 25px;
        }

        .back-link:hover {
            color: var(--primary-blue);
        }
    </style>
</head>

<body>

    <!-- Ambient Decor -->
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <div class="login-card">
        <div class="login-header-icon">
            {% if "Teacher" in welcome_message %}🍎{% else %}🎓{% endif %}
        </div>

        <h3 class="login-title">{{ welcome_message }}</h3>

        <form method="POST">
            {% csrf_token %}
            <div class="mb-4 text-start">
                <label class="form-label text-muted">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required />
            </div>

            <div class="mb-4 text-start">
                <label class="form-label text-muted">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required />
            </div>

            <button type="submit" class="btn btn-submit">
                Let's Go! 🚀
            </button>
        </form>

        <div>
            <a href="{% url 'core:index' %}" class="back-link">
                ← Back to Home
            </a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
