{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Edit Profile | FSLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body { font-family: "Fredoka", sans-serif; background-color: #f8f9fa; }
        .form-card { background: white; border-radius: 20px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05); padding: 30px; margin-top: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="form-card">
                    <h3 class="fw-bold mb-4">Edit Profile</h3>
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <fieldset class="mb-3">
                            <legend class="fs-5">Basic Info</legend>
                            {{ u_form.as_p }}
                        </fieldset>
                        <fieldset class="mb-4">
                            <legend class="fs-5">Teacher Details</legend>
                            {{ p_form.as_p }}
                        </fieldset>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary rounded-pill">Save Changes</button>
                            <a href="{% url 'teacher:teacher_dashboard' %}" class="btn btn-outline-secondary rounded-pill">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
