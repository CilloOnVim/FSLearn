{% extends 'learning/base.html' %}
{% load static %}

{% block content %}
<style>
    :root {
        --mint: #20c997;
        --purple: #6f42c1;
        --purple-dark: #4e2d8b;
        --cyan: #0dcaf0;
        --cyan-dark: #0aa2c0;
        --yellow: #ffd700;
        --yellow-dark: #d4b200;
        --pink: #ff6b6b;
    }

    body {
        background-color: #f0f8ff;
        font-family: "Fredoka", sans-serif;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        /* Locks the main page from scrolling */
        display: flex;
        flex-direction: column;
    }

    /* Fixed Top Bar */
    .top-bar {
        background-color: var(--cyan);
        padding: 15px 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        z-index: 10;
        flex-shrink: 0;
        border-bottom: 5px solid var(--cyan-dark);
    }

    .btn-back {
        background-color: var(--purple);
        color: white !important;
        border-radius: 50px;
        padding: 12px 30px;
        font-weight: 700;
        font-size: 1.5rem;
        text-decoration: none;
        box-shadow: 0 6px 0px var(--purple-dark);
        transition: transform 0.1s, box-shadow 0.1s;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .btn-back:active {
        transform: translateY(6px);
        box-shadow: 0 0px 0px var(--purple-dark);
    }

    .page-title {
        font-size: 3rem;
        font-weight: 700;
        color: white;
        margin: 0;
        text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.2);
    }

    /* Scrollable Library Area */
    .library-workspace {
        flex-grow: 1;
        padding: 30px;
        overflow-y: auto;
        /* Only this grid section scrolls */
        background-color: #f0f8ff;
    }

    /* Custom Chunky Scrollbar for Kids */
    .library-workspace::-webkit-scrollbar {
        width: 15px;
    }

    .library-workspace::-webkit-scrollbar-track {
        background: #e9ecef;
        border-radius: 10px;
    }

    .library-workspace::-webkit-scrollbar-thumb {
        background: var(--pink);
        border-radius: 10px;
        border: 3px solid #e9ecef;
    }

    /* Massive Grid */
    .story-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 30px;
        max-width: 1400px;
        margin: 0 auto;
        padding-bottom: 40px;
        /* Extra padding at the bottom */
    }

    /* Individual Story Cards */
    .story-card {
        background: white;
        border-radius: 25px;
        border: 5px solid #dee2e6;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.2s, border-color 0.2s;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
    }

    .story-card:hover {
        transform: translateY(-5px) scale(1.02);
        border-color: var(--yellow);
    }

    .story-thumb-wrapper {
        height: 220px;
        background-color: #e9ecef;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 5rem;
    }

    .story-thumb {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .story-body {
        padding: 20px;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 15px;
        flex-grow: 1;
        justify-content: space-between;
    }

    .story-title {
        font-size: 1.8rem;
        font-weight: 700;
        color: #333;
        margin: 0;
        line-height: 1.2;
    }

    .btn-play {
        background-color: var(--yellow);
        color: #333 !important;
        font-size: 1.6rem;
        font-weight: 700;
        padding: 15px;
        border-radius: 20px;
        text-decoration: none;
        display: block;
        box-shadow: 0 6px 0px var(--yellow-dark);
        transition: all 0.1s;
    }

    .btn-play:active {
        transform: translateY(6px);
        box-shadow: 0 0px 0px var(--yellow-dark);
    }
</style>

<div class="top-bar">
    <a href="{% url 'learning:story_list' %}" class="btn-back">
        <span>🔙</span> Back
    </a>
    <h1 class="page-title">📺 Story Library</h1>
    <div style="width: 130px;"></div>
</div>

<div class="library-workspace">
    <div class="story-grid">
        {% for story in stories %}
        <div class="story-card">
            <div class="story-thumb-wrapper">
                {% if story.thumbnail %}
                <img src="{{ story.thumbnail.url }}" class="story-thumb" alt="Thumbnail">
                {% else %}
                <span>🎬</span>
                {% endif %}
            </div>
            <div class="story-body">
                <h2 class="story-title">{{ story.title }}</h2>
                <a href="{% url 'learning:story_view' story.story_id %}" class="btn-play">▶️ Play!</a>
            </div>
        </div>
        {% empty %}
        <div style="grid-column: 1 / -1; text-align: center; padding: 50px;">
            <span style="font-size: 6rem;">🙈</span>
            <h2 class="text-muted fw-bold mt-4" style="font-size: 3rem;">No stories are ready yet!</h2>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
