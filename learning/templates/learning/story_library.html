{% load static %}

{% block content %}
<style>
    :root {
        --mint: #20c997;
        --purple: #6f42c1;
        --purple-dark: #4e2d8b;
        --cyan: #0dcaf0;
        --yellow: #ffd700;
        --yellow-dark: #d4b200;
        --pink: #ff6b6b;
    }

    body {
        background-color: #f0f8ff;
        font-family: "Fredoka", sans-serif;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* Floating Header from the Hub */
    .floating-header {
        padding: 30px 40px 0 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
    }

    .btn-back {
        background-color: var(--purple);
        color: white !important;
        border-radius: 50px;
        padding: 12px 30px;
        font-weight: 700;
        font-size: 1.5rem;
        text-decoration: none;
        box-shadow: 0 6px 0px var(--purple-dark);
        transition: all 0.1s;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .btn-back:active {
        transform: translateY(6px);
        box-shadow: 0 0px 0px transparent;
    }

    .page-title {
        font-size: 4rem;
        font-weight: 700;
        color: var(--pink);
        margin: 0;
        text-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
    }

    /* Full Screen Library Area */
    .library-workspace {
        flex-grow: 1;
        width: 100%;
        padding: 40px;
        overflow-y: auto;
        background-color: #f0f8ff;
        box-sizing: border-box;
    }

    /* Custom Chunky Scrollbar */
    .library-workspace::-webkit-scrollbar {
        width: 15px;
    }
    .library-workspace::-webkit-scrollbar-track {
        background: #e9ecef;
        border-radius: 10px;
    }
    .library-workspace::-webkit-scrollbar-thumb {
        background: var(--pink);
        border-radius: 10px;
        border: 3px solid #e9ecef;
    }

    /* Optimized Grid */
    .story-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 30px;
        width: 100%;
        padding-bottom: 40px;
    }

    /* Individual Story Cards */
    .story-card {
        background: white;
        border-radius: 25px;
        border: 5px solid #dee2e6;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.2s, border-color 0.2s;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        min-height: 350px;
    }

    .story-card:hover {
        transform: translateY(-5px) scale(1.02);
        border-color: var(--yellow);
    }

    .story-thumb-wrapper {
        height: 200px;
        background-color: #e9ecef;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 5rem;
    }

    .story-thumb {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .story-body {
        padding: 20px;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 15px;
        flex-grow: 1;
        justify-content: space-between;
    }

    .story-title {
        font-size: 1.8rem;
        font-weight: 700;
        color: #333;
        margin: 0;
        line-height: 1.2;
    }

    .btn-play {
        background-color: var(--yellow);
        color: #333 !important;
        font-size: 1.6rem;
        font-weight: 700;
        padding: 15px;
        border-radius: 20px;
        text-decoration: none;
        display: block;
        box-shadow: 0 6px 0px var(--yellow-dark);
        transition: all 0.1s;
    }

    .btn-play:active {
        transform: translateY(6px);
        box-shadow: 0 0px 0px var(--yellow-dark);
    }

    /* Mobile scaling for the header */
    @media (max-width: 900px) {
        .floating-header {
            padding: 20px;
        }
        .page-title { 
            font-size: 2.5rem; 
        }
        .btn-back {
            font-size: 1.2rem;
            padding: 10px 20px;
        }
        /* Hide the spacer on mobile so things center better */
        .spacer {
            display: none;
        }
    }
</style>

<div class="floating-header">
    <a href="{% url 'learning:story_list' %}" class="btn-back"><span>🔙</span> Back</a>
    <h1 class="page-title">📺 Story Library</h1>
    <div class="spacer" style="width: 140px;"></div> 
</div>

<div class="library-workspace">
    <div class="story-grid">
        {% for story in stories %}
        <div class="story-card">
            <div class="story-thumb-wrapper">
                {% if story.thumbnail %}
                <img src="{{ story.thumbnail.url }}" class="story-thumb" alt="Thumbnail">
                {% else %}
                <span>🎬</span>
                {% endif %}
            </div>
            <div class="story-body">
                <h2 class="story-title">{{ story.title }}</h2>
                <a href="{% url 'learning:story_view' story.story_id %}" class="btn-play">▶️ Play!</a>
            </div>
        </div>
        {% empty %}
        <div style="grid-column: 1 / -1; text-align: center; padding: 50px;">
            <span style="font-size: 6rem;">🙈</span>
            <h2 class="text-muted fw-bold mt-4" style="font-size: 3rem;">No stories are ready yet!</h2>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
