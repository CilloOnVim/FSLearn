{% extends 'learning/base.html' %}
{% load static %}

{% block layout %}
{% block content %}
<style>
    :root {
        --mint: #20c997;
        --mint-dark: #128c68;
        --purple: #6f42c1;
        --purple-dark: #4e2d8b;
        --cyan: #0dcaf0;
        --cyan-dark: #0aa2c0;
        --pink: #ff6b6b;
        --yellow: #ffc107;
        --yellow-dark: #cc9a06;
    }

    body {
        background-color: #f0f8ff;
        font-family: "Fredoka", sans-serif;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    .floating-header {
        padding: 30px 40px 0 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
    }

    .btn-back {
        background-color: var(--purple);
        color: white !important;
        border-radius: 50px;
        padding: 12px 30px;
        font-weight: 700;
        font-size: 1.5rem;
        text-decoration: none;
        box-shadow: 0 6px 0px var(--purple-dark);
        transition: all 0.1s;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .btn-back:active {
        transform: translateY(6px);
        box-shadow: 0 0px 0px transparent;
    }

    .page-title {
        font-size: 4rem;
        font-weight: 700;
        color: var(--pink);
        margin: 0;
        text-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
    }

    .hub-workspace {
        flex-grow: 1;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 30px;
        padding: 40px;
        align-items: stretch;
    }

    /* THE FIX: Reduced flex-basis and max-width to guarantee 4 columns */
    .hub-card {
        flex: 1 1 200px;
        max-width: 300px;
        border-radius: 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-decoration: none;
        color: white !important;
        transition: all 0.15s;
    }

    .hub-card-stories {
        background-color: var(--cyan);
        box-shadow: 0 15px 0px var(--cyan-dark);
    }

    .hub-card-puzzles {
        background-color: var(--mint);
        box-shadow: 0 15px 0px var(--mint-dark);
    }

    .hub-card-math {
        background-color: var(--yellow);
        box-shadow: 0 15px 0px var(--yellow-dark);
    }

    .hub-card-vocab {
        background-color: var(--pink);
        box-shadow: 0 15px 0px #c92a2a;
    }

    .hub-card:active {
        transform: translateY(15px);
        box-shadow: 0 0px 0px transparent;
    }

    .hub-icon {
        font-size: 8rem;
        line-height: 1;
        margin-bottom: 20px;
        text-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .hub-title {
        font-size: 3.5rem;
        font-weight: 700;
        text-align: center;
        margin: 0;
        line-height: 1.1;
    }

    @media (max-width: 900px) {
        .hub-workspace {
            flex-direction: column;
        }

        .hub-icon {
            font-size: 5rem;
        }

        .hub-title {
            font-size: 2.5rem;
        }

        .page-title {
            font-size: 2.5rem;
        }
    }
</style>

<div class="floating-header">
    <a href="{% url 'student:student_dashboard' %}" class="btn-back"><span>🔙</span> Back</a>
    <h1 class="page-title">Let's Play!</h1>
    <div style="width: 140px;"></div>
</div>

<div class="hub-workspace">
    <a href="{% url 'learning:story_library' %}" class="hub-card hub-card-stories">
        <div class="hub-icon">📺</div>
        <h2 class="hub-title">Watch<br>Stories</h2>
    </a>

    <a href="{% url 'learning:quiz_list' %}" class="hub-card hub-card-puzzles">
        <div class="hub-icon">🧩</div>
        <h2 class="hub-title">Sentence<br>Puzzle</h2>
    </a>

    <a href="{% url 'learning:math_quiz' %}" class="hub-card hub-card-math">
        <div class="hub-icon">🔢</div>
        <h2 class="hub-title">Math<br>Magic</h2>
    </a>

    <a href="{% url 'learning:vocab_quiz_list' %}" class="hub-card hub-card-vocab">
        <div class="hub-icon">✨</div>
        <h2 class="hub-title">Vocab<br>Quiz</h2>
    </a>
</div>
{% endblock %}
{% endblock %}
