<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% if is_edit %}Edit{% else %}Upload{% endif %} Story | FSLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; background-color: #f8f9fa; }
        .upload-card { border: none; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="p-4 d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    
    <div class="card upload-card p-4 col-md-6 col-lg-5">
        <h2 class="fw-bold text-center text-dark mb-4">
            {% if is_edit %}✏️ Edit Story{% else %}📖 Add a New Story{% endif %}
        </h2>
        
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label fw-bold text-secondary">Select Theme</label>
                {{ form.theme }}
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold text-secondary">Story Title</label>
                {{ form.title }}
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold text-secondary">Story Video (MP4)</label>
                {{ form.video }}
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold text-secondary">Thumbnail Image (Optional)</label>
                {{ form.thumbnail }}
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold text-secondary">Description</label>
                {{ form.description }}
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary rounded-pill fw-bold">Save Story</button>
                <a href="{% url 'learning:manage_content' %}" class="btn btn-light rounded-pill text-muted">Cancel</a>
            </div>
        </form>
    </div>

</body>
</html>
