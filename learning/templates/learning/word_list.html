{% extends 'learning/base.html' %}
{% load static %}

{% block title %}{{ section.title }} | Words{% endblock %}

{% block extra_head %}
<style>
    :root {
        --purple: #6f42c1;
        --purple-dark: #4e2d8b;
        --bg-color: #fff8cc;
    }

    body {
        background-color: var(--bg-color);
        background-image: radial-gradient(#fde876 3px, transparent 3px);
        background-size: 30px 30px;
    }

    .word-header {
        font-size: 3.5rem;
        font-weight: 900;
        color: #ff922b;
        text-shadow: 2px 2px 0px white;
        margin-bottom: 40px;
        letter-spacing: 1px;
    }

    .word-card {
        background: white;
        border-radius: 25px;
        transition: all 0.1s ease;
        cursor: pointer;
        border: 5px solid;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 25px;
        text-align: center;
        text-decoration: none !important;
        position: relative;
        font-size: 1.5rem;
        font-weight: 800;
    }

    /* Playful automated coloring */
    .word-wrapper:nth-child(4n+1) .word-card { border-color: #FF6B6B; box-shadow: 0 8px 0px #c92a2a; color: #c92a2a; }
    .word-wrapper:nth-child(4n+2) .word-card { border-color: #20c997; box-shadow: 0 8px 0px #0ca678; color: #0ca678; }
    .word-wrapper:nth-child(4n+3) .word-card { border-color: #339af0; box-shadow: 0 8px 0px #1c7ed6; color: #1c7ed6; }
    .word-wrapper:nth-child(4n+4) .word-card { border-color: #cc5de8; box-shadow: 0 8px 0px #9c36b5; color: #9c36b5; }

    .word-card:hover {
        transform: translateY(-4px);
    }
    
    .word-wrapper:nth-child(4n+1) .word-card:hover { box-shadow: 0 12px 0px #c92a2a; }
    .word-wrapper:nth-child(4n+2) .word-card:hover { box-shadow: 0 12px 0px #0ca678; }
    .word-wrapper:nth-child(4n+3) .word-card:hover { box-shadow: 0 12px 0px #1c7ed6; }
    .word-wrapper:nth-child(4n+4) .word-card:hover { box-shadow: 0 12px 0px #9c36b5; }

    .word-card:active {
        transform: translateY(8px);
        box-shadow: 0 0px 0px transparent !important;
    }

    .btn-chunky {
        background-color: var(--purple);
        color: white !important;
        border-radius: 50px;
        padding: 12px 30px;
        font-size: 1.4rem;
        font-weight: 800;
        text-decoration: none;
        border: none;
        box-shadow: 0 6px 0px var(--purple-dark);
        transition: all 0.1s ease;
        display: inline-flex;
        align-items: center;
    }

    .btn-chunky:active {
        transform: translateY(6px);
        box-shadow: 0 0px 0px transparent;
    }
</style>
{% endblock %}

{% block layout %}
<div class="py-5" style="min-height: 100vh;">
    <div class="container">
        <!-- Top Navigation -->
        <div class="d-flex justify-content-between align-items-center mb-5">
            <a href="{% url 'learning:section_list' section.theme.pk %}" class="btn-chunky">
                <span class="fs-4 me-2">🔙</span> Back
            </a>
        </div>

        <h1 class="text-center word-header">Let's Learn: {{ section.title }}</h1>

        <div class="row g-4 justify-content-center">
            {% for word in words %}
            <div class="col-6 col-md-4 col-lg-3 word-wrapper">
                <a href="{% url 'learning:word_detail' word.slug %}" class="word-card w-100 h-100" style="min-height: 120px;">
                    {{ word.name }}
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
