{% extends 'learning/base.html' %}
{% load static %}

{% block title %}{{ section.title }} | Words{% endblock %}

{% block extra_head %}
<style>
    .btn-chunky {
        background-color: #6f42c1;
        color: white;
        border-radius: 50px;
        padding: 10px 25px;
        font-weight: 700;
        text-decoration: none;
        border: none;
        box-shadow: 0 4px 0px #4e2d8b, 0 5px 10px rgba(0, 0, 0, 0.1);
        transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: inline-block;
    }

    .btn-chunky:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 0px #4e2d8b, 0 8px 15px rgba(0, 0, 0, 0.15);
        color: white;
    }

    .btn-chunky:active {
        transform: translateY(4px);
        box-shadow: 0 0px 0px #4e2d8b, 0 2px 5px rgba(0, 0, 0, 0.1);
    }
</style>
{% endblock %}

{% block layout %}
<div class="p-4" style="background-color: #fff3cd; min-height: 100vh;">
    <div class="container">
        <div class="d-flex justify-content-start mb-4">
            <a href="{% url 'learning:section_list' section.theme.pk %}" class="btn-chunky">
                <span class="fs-5 me-2">🔙</span> Back to Sections
            </a>
        </div>

        <h2 class="text-center fw-bold mb-5">Let's Learn: {{ section.title }}</h2>

        <div class="row g-3">
            {% for word in words %}
            <div class="col-6 col-md-3">
                <a href="{% url 'learning:word_detail' word.slug %}"
                    class="btn btn-light w-100 py-4 shadow fw-bold rounded-3"
                    style="background-color: white; border-bottom: 5px solid #ffc107;">
                    {{ word.name }}
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
