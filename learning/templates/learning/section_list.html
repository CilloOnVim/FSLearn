{% extends 'learning/base.html' %}
{% load static %}

{% block title %}{{ theme.title }} | Sections{% endblock %}

{% block extra_head %}
<style>
    .btn-chunky {
        background-color: #6f42c1;
        color: white;
        border-radius: 50px;
        padding: 10px 25px;
        font-weight: 700;
        text-decoration: none;
        border: none;
        box-shadow: 0 4px 0px #4e2d8b, 0 5px 10px rgba(0, 0, 0, 0.1);
        transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: inline-block;
    }

    .btn-chunky:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 0px #4e2d8b, 0 8px 15px rgba(0, 0, 0, 0.15);
        color: white;
    }

    .btn-chunky:active {
        transform: translateY(4px);
        box-shadow: 0 0px 0px #4e2d8b, 0 2px 5px rgba(0, 0, 0, 0.1);
    }
</style>
{% endblock %}

{% block layout %}
<div class="p-4" style="background-color: #e0f7fa; min-height: 100vh;">
    <div class="container text-center">
        <div class="d-flex justify-content-start mb-4">
            <a href="{% url 'learning:theme_list' %}" class="btn-chunky">
                <span class="fs-5 me-2">🔙</span> Back to Themes
            </a>
        </div>

        <h2 class="fw-bold mb-4">{{ theme.title }}</h2>

        <div class="d-grid gap-3 col-md-6 mx-auto">
            {% for section in sections %}
            <a href="{% url 'learning:word_list' section.pk %}"
                class="btn btn-lg btn-light shadow p-4 fw-bold rounded-pill"
                style="color: #007bff; border: 2px solid #007bff;">
                {{ section.title }}
            </a>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
